<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Cyan glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#00dbe9" />
    </linearGradient>
  </defs>
  
  <!-- Outer glowing hexagon/diamond representing Onyx -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" 
           fill="none" 
           stroke="url(#cyan-gradient)" 
           stroke-width="5" 
           filter="url(#glow)" />
           
  <!-- Inner stylized O or Shield shape -->
  <path d="M50 25 C36 25 32 40 32 50 C32 60 36 75 50 75 C64 75 68 60 68 50 C68 40 64 25 50 25 Z M50 35 C58 35 60 45 60 50 C60 55 58 65 50 65 C42 65 40 55 40 50 C40 45 42 35 50 35 Z" 
        fill="url(#cyan-gradient)" />
</svg>