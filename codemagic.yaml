workflows:
  capacitor-ios-workflow:
    name: Onyx Wallet Capacitor iOS (Simulator Build)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "frontend/ios/App/App.xcodeproj/project.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm install
      - name: Compile web assets
        script: |
          cd frontend
          npm run build
      - name: Sync Capacitor assets
        script: |
          cd frontend
          npx cap sync ios
      - name: Install Pods (if Podfile exists)
        script: |
          cd frontend/ios/App
          if [ -f "Podfile" ]; then
            pod install
          else
            echo "Using Swift Package Manager (Capacitor 6 default). Skipping Pod install."
          fi
      - name: Build Simulator App
        script: |
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          cd build/Build/Products/Debug-iphonesimulator
          zip -r OnyxWallet_Simulator.zip App.app
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.zip
      - /tmp/xcodebuild_logs/*.log

  capacitor-android-workflow:
    name: Onyx Wallet Capacitor Android (Debug APK)
    max_build_duration: 120
    instance_type: linux_l
    environment:
      android_ndk: latest
      java: 17
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm install
      - name: Compile web assets
        script: |
          cd frontend
          npm run build
      - name: Sync Capacitor assets
        script: |
          cd frontend
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - frontend/android/app/build/outputs/apk/debug/*.apk
